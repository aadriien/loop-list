<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>loop-list</title>
    <script>
      try {
        const theme = localStorage.getItem("loop-list-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script>
      // Owner visits (myself) are counted under /me, separate from everyone else's
      window.goatcounter = {
        path: (p) => {
          try {
            return JSON.parse(localStorage.getItem("loop-list-auth")).isOwner
              ? "/me"
              : p;
          } catch {
            return p;
          }
        },
      };
    </script>
    <script
      data-goatcounter="https://looplist.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
